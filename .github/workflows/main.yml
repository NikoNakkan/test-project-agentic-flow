name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check index scripts compile
        run: python -m compileall scripts

      - name: Verify app builds (present layers)
        run: python scripts/app_build_verify.py --repo .
